<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS Tech Limited — Special Notice</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <div class="notice-header">
          <div class="brand">
            <div class="brand-mark">BS</div>
            <div>BS Tech Limited</div>
          </div>
          <a href="/worker.html" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 6px;">
            <span>←</span> Back to Dashboard
          </a>
        </div>

        <section class="card" style="padding: 28px;">
          <!-- Hero Banner Image -->
          <div id="noticeHeroWrap" class="notice-hero-wrap hidden">
            <img id="noticeHeroImg" src="" alt="Offer Banner" />
          </div>

          <!-- Headline / Title -->
          <h1 id="noticeTitle" class="notice-title">लोड हो रहा है…</h1>

          <!-- Formatted Content / Text -->
          <div id="noticeBody" class="notice-body">कृपया प्रतीक्षा करें…</div>

          <!-- Video Section -->
          <div id="noticeVideoWrap" class="notice-video-wrap hidden"></div>

          <!-- Call to Action Link / Button -->
          <div id="noticeCtaWrap" class="notice-cta-wrap hidden">
            <a id="noticeCtaBtn" href="#" target="_blank" rel="noopener noreferrer" class="notice-cta-btn">
              <span>👉</span> <span id="noticeCtaText">यहां क्लिक करें</span>
            </a>
          </div>

          <!-- Extra Images Gallery -->
          <div id="noticeGalleryTitle" class="section-title hidden" style="margin-top: 24px; font-size: 1.1rem;">
            संबंधित तस्वीरें / प्रमाण
          </div>
          <div id="noticeGalleryWrap" class="notice-gallery hidden"></div>

          <div class="divider" style="margin: 32px 0 20px;"></div>

          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <span class="muted" style="font-size: 0.88rem;">
              © BS Tech Limited · All rights reserved.
            </span>
            <a href="/worker.html" class="btn btn-primary" style="padding: 9px 20px;">
              Go to Tasks & Dashboard →
            </a>
          </div>
        </section>
      </div>
    </div>

    <script src="/js/notice.js"></script>
  </body>
</html>
