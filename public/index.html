<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS Tech Limited — Login</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page-center">
      <div class="card card-narrow">
        <div class="brand" style="margin-bottom: 18px">
          <div class="brand-mark">BS</div>
          <div>BS Tech Limited</div>
        </div>
        <h1 class="card-title">Sign in</h1>
        <p class="card-sub">Enter your user ID and password to continue.</p>

        <div id="error" class="alert alert-error hidden"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="userId">User ID</label>
            <input
              id="userId"
              name="userId"
              type="text"
              autocomplete="username"
              placeholder="Enter your user ID"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
          </div>
          <button class="btn btn-primary btn-block" type="submit">
            Login
          </button>
        </form>

        <p class="footer-note">
          <strong>BS Tech Limited</strong>
        </p>
      </div>
    </div>
    <script src="/js/login.js"></script>
  </body>
</html>
